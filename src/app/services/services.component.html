<div class="container mt-5">
    <div class="row justify-content-center">
      <div *ngFor="let service of services; let i = index" class="col-12 col-md-6 col-lg-4 mb-4">
        <div class="card text-white {{ service.bgColor }} h-100 shadow-sm rounded-lg">
          <div class="card-body d-flex flex-column justify-content-between">
            <h5 class="card-title">{{ service.title }}</h5>
            <p class="card-text">{{ service.description }}</p>
            <!-- Replace button with a simple link -->
            <a [routerLink]="['/services', service.title]" class="see-more-link">See More ...</a>
          </div>
        </div>
      </div>
    </div>
  </div>
