<div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-lg rounded-4 border-0 right-form">
          <div class="card-body p-4">
            <h3 class="card-title mb-4 text-center text-primary">Contact Us</h3>
            <form
              action="https://formspree.io/f/xpwdpekk"
              method="POST"
              class="contact-form"
            >
              <!-- First Name -->
              <div class="mb-3">
                <label for="firstName" class="form-label">First Name</label>
                <input
                  type="text"
                  name="firstName"
                  id="firstName"
                  class="form-control"
                  placeholder="Enter your first name"
                  required
                />
              </div>
  
              <!-- Last Name -->
              <div class="mb-3">
                <label for="lastName" class="form-label">Last Name</label>
                <input
                  type="text"
                  name="lastName"
                  id="lastName"
                  class="form-control"
                  placeholder="Enter your last name"
                  required
                />
              </div>
  
              <!-- Contact Number (not required) -->
              <div class="mb-3">
                <label for="contactNumber" class="form-label">Contact Number</label>
                <input
                  type="tel"
                  name="contactNumber"
                  id="contactNumber"
                  class="form-control"
                  placeholder="Enter your contact number"
                />
              </div>
  
              <!-- Email -->
              <div class="mb-3">
                <label for="email" class="form-label">Your Email</label>
                <input
                  type="email"
                  name="email"
                  id="email"
                  class="form-control"
                  placeholder="Enter your email"
                  required
                />
              </div>
  
              <!-- Message (not required) -->
              <div class="mb-3">
                <label for="message" class="form-label">Your Message</label>
                <textarea
                  name="message"
                  id="message"
                  rows="5"
                  class="form-control"
                  placeholder="Type your message here"
                ></textarea>
              </div>
  
              <!-- Submit Button -->
              <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg custom-btn">
                  Send Message
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
