<div class="contact-wrapper py-5 px-3">
  <div class="container">
    <div class="row justify-content-center">
      <!-- Left Side Image -->
      <div class="col-lg-6 aos-init" data-aos="fade-right" data-aos-duration="1000">
        <img src="assets/contactus.png" alt="Contact Image" class="img-fluid rounded-4">
      </div>

      <!-- Right Side Form -->
      <div class="col-lg-6 aos-init" data-aos="zoom-in-up" data-aos-duration="1000">
        <div class="glass-card p-4 shadow-lg animate__animated animate__fadeInUp">
          <h2 class="text-center text-primary mb-4 fw-bold animate__animated animate__fadeInDown">Let's Get In Touch</h2>
          <form action="https://formspree.io/f/xpwdpekk" method="POST" class="needs-validation" novalidate>
            <!-- First Name -->
            <div class="form-floating mb-3 animate__animated animate__fadeInLeft animate__delay-1s">
              <input type="text" class="form-control focus-animate" id="firstName" name="firstName" placeholder="First Name" required>
              <label for="firstName"><i class="fas fa-user me-2"></i>First Name</label>
            </div>
  
            <!-- Last Name -->
            <div class="form-floating mb-3 animate__animated animate__fadeInRight animate__delay-1s">
              <input type="text" class="form-control focus-animate" id="lastName" name="lastName" placeholder="Last Name" required>
              <label for="lastName"><i class="fas fa-user me-2"></i>Last Name</label>
            </div>
  
            <!-- Contact Number -->
            <div class="form-floating mb-3 animate__animated animate__fadeInLeft animate__delay-2s">
              <input type="tel" class="form-control focus-animate" id="contactNumber" name="contactNumber" placeholder="Contact Number">
              <label for="contactNumber"><i class="fas fa-phone me-2"></i>Contact Number</label>
            </div>
  
            <!-- Email -->
            <div class="form-floating mb-3 animate__animated animate__fadeInRight animate__delay-2s">
              <input type="email" class="form-control focus-animate" id="email" name="email" placeholder="Email" required>
              <label for="email"><i class="fas fa-envelope me-2"></i>Email</label>
            </div>
  
            <!-- Message -->
            <div class="form-floating mb-3 animate__animated animate__fadeInUp animate__delay-3s">
              <textarea class="form-control focus-animate" id="message" name="message" placeholder="Your message" style="height: 120px;"></textarea>
              <label for="message"><i class="fas fa-comment-dots me-2"></i>Your Message</label>
            </div>
  
            <div class="d-grid animate__animated animate__zoomIn animate__delay-4s">
              <button class="btn btn-gradient btn-lg hover-bounce" type="submit">
                <i class="fas fa-paper-plane me-2"></i>Send Message
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
