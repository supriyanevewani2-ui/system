
<nav class="skylon-navbar">

  <div class="navbar-container">

    <!-- =========================================
         LOGO + BRAND
    ========================================== -->

    <a routerLink="/" class="brand-logo">

      <div class="logo-mark">
        <img
          src="assets/logo-finall-png.png"
          alt="SkylonSys Logo"
          class="company-logo">
      </div>

    

    </a>


    <!-- =========================================
         DESKTOP NAVIGATION
    ========================================== -->

    <div class="desktop-navigation">

      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link">

        <i class="fas fa-home"></i>
        <span>Home</span>

      </a>


      <a
        routerLink="/services"
        routerLinkActive="active"
        class="nav-link">

        <i class="fas fa-cogs"></i>
        <span>Services</span>

      </a>


      <a
        routerLink="/courses"
        routerLinkActive="active"
        class="nav-link">

        <i class="fas fa-graduation-cap"></i>
        <span>Courses</span>

      </a>


      <a
        routerLink="/contactus"
        routerLinkActive="active"
        class="nav-link">

        <i class="fas fa-envelope"></i>
        <span>Contact Us</span>

      </a>

    </div>


    <!-- =========================================
         MOBILE MENU BUTTON
    ========================================== -->

 <button
  class="mobile-menu-button"
  type="button"
  aria-label="Open navigation menu"
  (click)="toggleMobileMenu()"
  [class.open]="isMobileMenuOpen">

  <span></span>
  <span></span>
  <span></span>

</button>


    <!-- =========================================
         MOBILE NAVIGATION
    ========================================== -->

<div
  class="mobile-navigation"
  [class.open]="isMobileMenuOpen">
      <a
  routerLink="/"
  routerLinkActive="active"
  [routerLinkActiveOptions]="{ exact: true }"
  class="mobile-nav-link"
  (click)="closeMobileMenu()">

        <span class="mobile-icon">
          <i class="fas fa-home"></i>
        </span>

        <span>Home</span>

      </a>


      <a
  routerLink="/services"
  routerLinkActive="active"
  class="mobile-nav-link"
  (click)="closeMobileMenu()">

        <span class="mobile-icon">
          <i class="fas fa-cogs"></i>
        </span>

        <span>Services</span>

      </a>


      <a
  routerLink="/courses"
  routerLinkActive="active"
  class="mobile-nav-link"
  (click)="closeMobileMenu()">

        <span class="mobile-icon">
          <i class="fas fa-graduation-cap"></i>
        </span>

        <span>Courses</span>

      </a>


      <a
  routerLink="/contactus"
  routerLinkActive="active"
  class="mobile-nav-link"
  (click)="closeMobileMenu()">
        <span class="mobile-icon">
          <i class="fas fa-envelope"></i>
        </span>

        <span>Contact Us</span>

      </a>

    </div>

  </div>

</nav>
